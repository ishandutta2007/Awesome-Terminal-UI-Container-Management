<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Grid Pattern for Cyber/Terminal Aesthetic -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style><![CDATA[
    .terminal-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .title-font { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* Subtle Background Dynamic Pulse and Flow Animation */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.45; }
    }
    @keyframes floatDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes nodeFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes nodeFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    .bg-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 260px; }
    .animated-wire { stroke-dasharray: 8, 8; animation: floatDash 6s linear infinite; }
    .cli-cursor { animation: blinkCursor 1s infinite; }
    .floating-card-1 { animation: nodeFloat1 5s ease-in-out infinite; }
    .floating-card-2 { animation: nodeFloat2 6s ease-in-out infinite; }
  ]]></style>

  <!-- Deep Terminal Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#cyberGrid)" />

  <!-- Dynamic Ambient Background Glows (Always in background behind cards & text) -->
  <g opacity="0.3">
    <circle class="bg-orb-1" cx="220" cy="110" r="140" fill="#00f2fe" filter="url(#neonGlow)" />
    <circle class="bg-orb-2" cx="980" cy="240" r="160" fill="#3b82f6" filter="url(#neonGlow)" />
    <circle cx="600" cy="180" r="90" fill="#10b981" opacity="0.15" filter="url(#neonGlow)" />
  </g>

  <!-- Animated Circuit / Network Streams in Background -->
  <g opacity="0.4">
    <path class="animated-wire" d="M 50 180 Q 250 80 450 180 T 850 180 T 1150 120" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="animated-wire" d="M 100 280 Q 350 320 600 240 T 1100 220" fill="none" stroke="#34d399" stroke-width="1.5" style="animation-duration: 9s;" />
  </g>

  <!-- Decorative Background Terminal Window Silhouette (Right Side) -->
  <g class="floating-card-2" transform="translate(870, 45)" opacity="0.85">
    <rect width="280" height="190" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
    <rect width="280" height="28" rx="10" fill="#1e293b" />
    <!-- Window Controls -->
    <circle cx="16" cy="14" r="4.5" fill="#ef4444" />
    <circle cx="30" cy="14" r="4.5" fill="#f59e0b" />
    <circle cx="44" cy="14" r="4.5" fill="#10b981" />
    <text x="65" y="18" fill="#94a3b8" class="terminal-text" font-size="10">container-tui: live-stats</text>
    
    <!-- Code / Container status lines -->
    <text x="18" y="55" fill="#38bdf8" class="terminal-text" font-size="11">❯ k9s -A --context=prod</text>
    <text x="18" y="78" fill="#34d399" class="terminal-text" font-size="10">● ingress-gateway   [2/2] Running</text>
    <text x="18" y="96" fill="#34d399" class="terminal-text" font-size="10">● redis-cluster-0   [1/1] Running</text>
    <text x="18" y="114" fill="#38bdf8" class="terminal-text" font-size="10">● api-worker-v2     [1/1] 14.2% CPU</text>
    <text x="18" y="132" fill="#a78bfa" class="terminal-text" font-size="10">● compose: web+db   [UP]  45 MB</text>
    <path d="M 18 150 L 260 150" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="170" fill="#64748b" class="terminal-text" font-size="9">MEM: [||||||||......] 42% | IO: 1.2MB/s</text>
  </g>

  <!-- Left Side Floating Micro Card (Docker / Podman Live Status) -->
  <g class="floating-card-1" transform="translate(50, 60)" opacity="0.85">
    <rect width="210" height="95" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    <rect width="210" height="22" rx="8" fill="#1e293b" />
    <circle cx="14" cy="11" r="3.5" fill="#38bdf8" />
    <text x="26" y="15" fill="#94a3b8" class="terminal-text" font-size="9">daemon: /var/run/docker.sock</text>
    <text x="14" y="44" fill="#38bdf8" class="terminal-text" font-size="11">CONTAINERS: 18 Active</text>
    <text x="14" y="62" fill="#e2e8f0" class="terminal-text" font-size="10">PODS: 12 Running | 0 Err</text>
    <text x="14" y="80" fill="#10b981" class="terminal-text" font-size="10">CLI: lazydocker &amp; k9s attached</text>
  </g>

  <!-- Primary Foreground Content (Always prominent & readable) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- CLI Prompt Badge -->
    <rect x="-190" y="-105" width="380" height="32" rx="16" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="0" y="-84" fill="#38bdf8" class="terminal-text" font-size="12" font-weight="600" letter-spacing="1.5">
      $ docker ps --format "table {{.Names}}\t{{.Status}}"
      <tspan class="cli-cursor" fill="#00f2fe">_</tspan>
    </text>

    <!-- Main Title -->
    <text x="0" y="-20" fill="#ffffff" class="title-font" font-size="38" font-weight="900" letter-spacing="-0.5">
      Awesome Terminal UI &amp; Container Management
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="15" fill="#94a3b8" class="title-font" font-size="15" font-weight="400" letter-spacing="0.2">
      Curated Production Hub for Keyboard-Driven TUIs, Kubernetes &amp; Docker Ecosystems
    </text>

    <!-- Category Pill Tags (High-Contrast Foreground Badges) -->
    <g transform="translate(0, 50)">
      <!-- Pill 1: Terminal UI -->
      <g transform="translate(-250, 0)">
        <rect x="0" y="0" width="115" height="28" rx="14" fill="#1e293b" stroke="#00f2fe" stroke-width="1" />
        <text x="57" y="18" fill="#38bdf8" class="terminal-text" font-size="11" font-weight="600" text-anchor="middle">⚡ TUI / CLI</text>
      </g>
      <!-- Pill 2: Kubernetes -->
      <g transform="translate(-120, 0)">
        <rect x="0" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
        <text x="62" y="18" fill="#60a5fa" class="terminal-text" font-size="11" font-weight="600" text-anchor="middle">☸️ Kubernetes</text>
      </g>
      <!-- Pill 3: Docker & Podman -->
      <g transform="translate(20, 0)">
        <rect x="0" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1" />
        <text x="67" y="18" fill="#34d399" class="terminal-text" font-size="11" font-weight="600" text-anchor="middle">🐳 Docker &amp; Podman</text>
      </g>
      <!-- Pill 4: SRE & DevOps -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
        <text x="60" y="18" fill="#c084fc" class="terminal-text" font-size="11" font-weight="600" text-anchor="middle">🛠️ SRE &amp; DevOps</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGlow)" />
</svg>
